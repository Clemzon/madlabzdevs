<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Profile – MadLabzDevs</title>
  <link href="/css/styles.css" rel="stylesheet" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css"
    rel="stylesheet"
  />
  <script type="module" src="/js/header.js"></script>
</head>
<body id="page-profile">
  <div id="shared-header"></div>
  <div class="pt-5 mt-5"></div>

  <main class="container py-5">
    <div class="d-flex justify-content-center mb-4">
      <h1 class="display-4 me-2">Your Profile</h1>
      <button
        id="btnProfileSettings"
        class="btn btn-link text-secondary fs-4 d-none d-md-inline-block"
        title="Profile Settings"
        aria-label="Profile Settings"
      >
        <i class="bi bi-gear-fill"></i>
      </button>
    </div>

    <div class="row justify-content-center">
      <div class="col-md-6 text-center">
        <h2 id="profileName"></h2>
        <p id="profileEmail"></p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/profilePage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
