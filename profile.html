

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>MadLabzDevs – Profile</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Core theme CSS (includes Bootstrap)-->
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="d-flex" id="wrapper">
    <!-- Static Sidebar -->
    <div class="border-end bg-white" id="sidebar-wrapper">
      <div class="sidebar-heading border-bottom bg-light">MadLabzDevs</div>
      <div class="list-group list-group-flush">
        <a class="list-group-item list-group-item-action list-group-item-light p-3" href="index.html">Dashboard</a>
        <a class="list-group-item list-group-item-action list-group-item-light p-3" href="projects.html">Projects</a>
        <a class="list-group-item list-group-item-action list-group-item-light p-3" href="message_board.html">Message Board</a>
        <a class="list-group-item list-group-item-action list-group-item-light p-3" href="events.html">Events</a>
        <a class="list-group-item list-group-item-action list-group-item-light p-3" href="portfolio.html">Portfolio</a>
        <a class="list-group-item list-group-item-action list-group-item-light p-3 active" href="profile.html">Profile</a>
      </div>
    </div>
    <!-- Page content wrapper -->
    <div id="page-content-wrapper">
      <!-- Top navigation-->
      <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
        <div class="container-fluid">
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent"
            aria-controls="navbarSupportedContent"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <!-- Add any top-right nav items if needed -->
          </div>
        </div>
      </nav>

      <!-- Page content-->
      <div class="container-fluid py-4">
        <h1 class="mb-4">Edit Profile</h1>
        <form id="profileForm" class="row g-3">
          <!-- Profile Picture Upload -->
          <div class="col-12 text-center">
            <img src="assets/img/profile.jpg" alt="Profile Photo" class="rounded-circle mb-3" width="120" height="120">
            <div>
              <label for="profilePic" class="form-label">Change Photo</label>
              <input class="form-control" type="file" id="profilePic" accept="image/*" />
            </div>
          </div>
          <!-- Username -->
          <div class="col-md-6">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="Enter your username" required />
          </div>
          <!-- Email -->
          <div class="col-md-6">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required />
          </div>
          <!-- Current Password (for verification) -->
          <div class="col-md-6">
            <label for="currentPassword" class="form-label">Current Password</label>
            <input type="password" class="form-control" id="currentPassword" placeholder="Current password" required />
          </div>
          <!-- New Password -->
          <div class="col-md-6">
            <label for="newPassword" class="form-label">New Password</label>
            <input type="password" class="form-control" id="newPassword" placeholder="New password" />
          </div>
          <!-- Confirm New Password -->
          <div class="col-md-6">
            <label for="confirmPassword" class="form-label">Confirm New Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" />
          </div>
          <!-- Save Changes Button -->
          <div class="col-12">
            <button class="btn btn-primary" type="submit">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <!-- MadLabzDevs core JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
