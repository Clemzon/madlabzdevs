<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>MadLabzDevs – Profile</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Core theme CSS (includes Bootstrap)-->
  <link href="css/styles.css" rel="stylesheet" />
  <style>
    body { padding-top: calc(56px /* header */ + 48px /* nav */); }
  </style>
</head>
<body id="page-top">
  <!-- Static Header Bar -->
  <header class="bg-dark text-white py-2 fixed-top">
    <div class="container px-4 px-lg-5">
      <span class="h5 mb-0">MadLabzDevs</span>
    </div>
  </header>
  <!-- Horizontal scrolling top nav bar -->
  <nav class="navbar navbar-expand-sm navbar-light bg-light border-bottom overflow-auto fixed-top" style="top:56px; z-index:1030;">
    <div class="container px-4 px-lg-5">
      <ul class="navbar-nav flex-row flex-nowrap">
        <li class="nav-item"><a class="nav-link px-3" href="index.html">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="projects.html">Projects</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="message_board.html">Message Board</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="events.html">Events</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="portfolio.html">Portfolio</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="profile.html">Profile</a></li>
      </ul>
    </div>
  </nav>

      <!-- Page content-->
      <div class="container-fluid py-4">
        <h1 class="mb-4">Edit Profile</h1>
        <form id="profileForm" class="row g-3">
          <!-- Profile Picture Upload -->
          <div class="col-12 text-center">
            <img src="assets/img/profile.jpg" alt="Profile Photo" class="rounded-circle mb-3" width="120" height="120">
            <div>
              <label for="profilePic" class="form-label">Change Photo</label>
              <input class="form-control" type="file" id="profilePic" accept="image/*" />
            </div>
          </div>
          <!-- Username -->
          <div class="col-md-6">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="Enter your username" required />
          </div>
          <!-- Email -->
          <div class="col-md-6">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required />
          </div>
          <!-- Current Password (for verification) -->
          <div class="col-md-6">
            <label for="currentPassword" class="form-label">Current Password</label>
            <input type="password" class="form-control" id="currentPassword" placeholder="Current password" required />
          </div>
          <!-- New Password -->
          <div class="col-md-6">
            <label for="newPassword" class="form-label">New Password</label>
            <input type="password" class="form-control" id="newPassword" placeholder="New password" />
          </div>
          <!-- Confirm New Password -->
          <div class="col-md-6">
            <label for="confirmPassword" class="form-label">Confirm New Password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" />
          </div>
          <!-- Save Changes Button -->
          <div class="col-12">
            <button class="btn btn-primary" type="submit">Save Changes</button>
          </div>
        </form>
      </div>
  <!-- MadLabzDevs core JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
