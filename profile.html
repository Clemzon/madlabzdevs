<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>MadLabzDevs • Profile</title>
  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Your CSS -->
  <link href="css/styles.css" rel="stylesheet" />

  <style>
    /* Offset for fixed header (32px) + nav (48px) */
    body {
      padding-top: calc(32px /* header */ + 48px /* nav */) !important;
    }
  </style>

  <!-- Load shared header/nav -->
  <script type="module" src="/js/header.js"></script>
</head>
<body id="page-top">

  <!-- Injected shared header/nav -->
  <div id="shared-header"></div>

  <!-- Spacer to push content below fixed header/nav -->
  <div class="pt-5 mt-5"></div>

  <!-- Profile Content -->
  <main class="container py-4">
    <div class="text-center mb-5">
      <h1 class="display-4">Your Profile</h1>
      <p class="lead">Manage your account details and preferences.</p>
    </div>

    <!-- Example: display user info loaded via your JS -->
    <section id="profileInfo" class="mb-5">
      <!-- JS can fill in the user's name, email, etc. -->
      <p><strong>Name:</strong> <span id="profileName">Loading…</span></p>
      <p><strong>Email:</strong> <span id="profileEmail">Loading…</span></p>
    </section>

    <!-- Example: profile completeness card -->
    <section id="profileCompleteness">
      <h2>Profile Completeness</h2>
      <div class="progress">
        <div
          id="completenessBar"
          class="progress-bar"
          role="progressbar"
          style="width: 0%;"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="100"
        >0%</div>
      </div>
    </section>
  </main>

  <!-- Firebase Auth listener (optional, if you need to show/hide parts) -->
  <script type="module">
    import { onAuthChange } from './js/firebase.js';
    onAuthChange(user => {
      document.body.classList.toggle('signed-in', !!user);
      if (user) {
        // Example: populate profile fields
        document.getElementById('profileName').textContent = user.displayName || '–';
        document.getElementById('profileEmail').textContent = user.email;
        // Compute and fill completeness here...
      }
    });
  </script>

  <!-- Your profile page logic -->
  <script type="module" src="js/profilePage.js"></script>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
