<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />
  <title>Thread • MadlabzDevs</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Your custom styles -->
  <link href="../css/styles.css" rel="stylesheet" />

  <!-- Only show comment form & “Load more” when signed in -->
  <style>
    #commentFormContainer,
    #btnLoadMoreComments {
      display: none;
    }
    body.signed-in #commentFormContainer,
    body.signed-in #btnLoadMoreComments {
      display: block;
    }
    /* Offset for fixed header (32px) + nav (48px) */
    body { padding-top: calc(32px + 48px) !important; }
  </style>

  <!-- Load shared header/nav -->
  <script type="module" src="/js/header.js"></script>
</head>
<body id="page-top">

  <!-- Injected shared header/nav -->
  <div id="shared-header"></div>

  <!-- Spacer to offset fixed header/nav -->
  <div class="pt-5 mt-5"></div>

  <!-- Page Layout: Sidebar + Main -->
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-3 bg-light vh-100 p-3 border-end">
        <h6 class="text-muted">Forums Navigation</h6>
        <ul id="forumsSidebar" class="nav flex-column mb-3">
          <li class="nav-item">
            <span class="text-muted ps-2">Loading…</span>
          </li>
        </ul>
        <input id="forumSearch" type="text" class="form-control" placeholder="🔍 Search forums…" />
      </aside>

      <!-- Main Content -->
      <main class="col-md-9 p-4">
        <!-- Thread Detail -->
        <div id="threadContent" class="mb-4">
          <h2 id="threadTitle">Loading…</h2>
          <p id="threadBody" class="lead">Please wait.</p>
          <p><small id="threadMeta" class="text-muted"></small></p>
          <hr />
        </div>

        <!-- New Comment Form (hidden unless signed in) -->
        <div id="commentFormContainer" class="mb-4"></div>

        <!-- Comments List -->
        <div id="commentsContainer"></div>

        <!-- Load More Comments (hidden unless signed in) -->
        <div class="text-center mt-3">
          <button id="btnLoadMoreComments" class="btn btn-outline-secondary">
            Load more comments
          </button>
        </div>
      </main>
    </div>
  </div>

  <!-- Firebase Auth listener -->
  <script type="module">
    import { onAuthChange } from '../js/firebase.js';
    onAuthChange(user => {
      document.body.classList.toggle('signed-in', !!user);
    });
  </script>

  <!-- Sidebar/Search handler -->
  <script type="module" src="../js/forumsList.js"></script>
  <!-- Thread detail & comments logic -->
  <script type="module" src="../js/threadPage.js"></script>
  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
