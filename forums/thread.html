<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />
  <title>Threads • MadlabzDevs</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Your CSS -->
  <link href="../css/styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="../index.html">MadlabzDevs</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="forums.html">Forums</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">Threads</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container my-4">
    <!-- Header: will be filled in by threadsList.js -->
    <div class="d-flex align-items-center mb-3">
      <div>
        <h1 id="forumTitle" class="mb-1">Forum Title</h1>
        <p id="forumDesc" class="text-muted">Forum description goes here.</p>
      </div>
      <button
        id="btnNewThread"
        class="btn btn-primary ms-auto"
        data-bs-toggle="modal"
        data-bs-target="#newThreadModal"
      >
        + New Thread
      </button>
    </div>

    <!-- Threads Grid -->
    <div id="threadsContainer" class="list-group">
      <!-- Each threadCard (forums/components/threadCard.html) will be injected here -->
    </div>
  </div>

  <!-- New Thread Modal -->
  <div
    class="modal fade"
    id="newThreadModal"
    tabindex="-1"
    aria-labelledby="newThreadLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newThreadLabel">Create New Thread</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formNewThread">
            <div class="mb-3">
              <label for="threadTitle" class="form-label">Thread Title</label>
              <input type="text" id="threadTitle" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="threadBody" class="form-label">Body</label>
              <textarea id="threadBody" class="form-control" rows="6" required></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="submit" form="formNewThread" class="btn btn-primary">
            Post Thread
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Your module entrypoint: threadsList.js will import firebase.js -->
  <script type="module" src="../js/threadsList.js"></script>

  <!-- Bootstrap Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
