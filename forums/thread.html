<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />
  <title>Thread • MadlabzDevs</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Your custom styles -->
  <link href="../css/styles.css" rel="stylesheet" />
</head>
<body id="page-top">
  <!-- Static Header Bar -->
  <header class="bg-dark text-white py-2 fixed-top">
    <div class="container px-4 px-lg-5">
      <span class="h5 mb-0">MadLabzDevs</span>
    </div>
  </header>

  <!-- Horizontal Top Nav -->
  <nav
    class="navbar navbar-expand-sm navbar-light bg-light border-bottom overflow-auto fixed-top"
    style="top:32px; z-index:1030;"
  >
    <div class="container px-4 px-lg-5">
      <ul class="navbar-nav flex-row flex-nowrap">
        <li class="nav-item">
          <a class="nav-link px-3" href="../projects.html">Projects</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3" href="forums.html">Forums</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3" href="../events.html">Events</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3" href="../portfolio.html">Portfolio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3 active" href="../profile.html">Profile</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Spacer to offset fixed header/nav -->
  <div class="pt-5 mt-5"></div>

  <!-- Page Layout: Sidebar + Main -->
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-3 bg-light vh-100 p-3 border-end">
        <h6 class="text-muted">Forums Navigation</h6>
        <ul id="forumsSidebar" class="nav flex-column mb-3">
          <li class="nav-item">
            <span class="text-muted ps-2">Loading…</span>
          </li>
        </ul>
        <input
          id="forumSearch"
          type="text"
          class="form-control"
          placeholder="🔍 Search forums…"
        />
      </aside>

      <!-- Main Content -->
      <main class="col-md-9 p-4">
        <!-- Thread Detail -->
        <div id="threadContent" class="mb-4">
          <h2 id="threadTitle">Loading…</h2>
          <p id="threadBody" class="lead">Please wait.</p>
          <p><small id="threadMeta" class="text-muted"></small></p>
          <hr />
        </div>

        <!-- New Comment Form -->
        <div id="commentFormContainer" class="mb-4"></div>

        <!-- Comments List -->
        <div id="commentsContainer"></div>

        <!-- Load More Comments -->
        <div class="text-center mt-3">
          <button id="btnLoadMoreComments" class="btn btn-outline-secondary">
            Load more comments
          </button>
        </div>
      </main>
    </div>
  </div>

  <!-- Sidebar/Search handler -->
  <script type="module" src="../js/forumsList.js"></script>
  <!-- Thread detail logic -->
  <script type="module" src="../js/threadPage.js"></script>
  <!-- Bootstrap Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
