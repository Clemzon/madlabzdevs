<!-- New Topic Modal -->
<div class="modal fade" id="newTopicModal" tabindex="-1" aria-labelledby="newTopicLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <form id="newTopicForm" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="newTopicLabel">Create New Topic</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="topicTitle" class="form-label">Topic Title</label>
          <input type="text" id="topicTitle" class="form-control" placeholder="Enter topic title" required />
        </div>
        <div class="mb-3">
          <label for="topicContent" class="form-label">Content</label>
          <textarea id="topicContent" class="form-control" rows="6" placeholder="Write your post here..." required></textarea>
        </div>
        <div id="newTopicFeedback" class="text-danger small"></div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-send"></i> Post Topic
        </button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="bi bi-x"></i> Cancel
        </button>
      </div>
    </form>
  </div>
</div>
