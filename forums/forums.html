<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />
  <title>Forums • MadlabzDevs</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Your CSS -->
  <link href="../css/styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="../index.html">MadlabzDevs</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="forums.html">Forums</a></li>
          <li class="nav-item"><a class="nav-link" href="../profile.html">Profile</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Layout: Sidebar + Main -->
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-3 bg-light vh-100 p-3">
        <h6 class="text-muted">Forums Navigation</h6>
        <ul id="forumsSidebar" class="nav flex-column">
          <!-- Populated by js/forumsList.js -->
          <li class="nav-item">
            <span class="text-muted ps-2">Loading…</span>
          </li>
        </ul>
      </aside>

      <!-- Main Content -->
      <main class="col-md-9 p-4">
        <!-- Header: Title, Search, New Forum -->
        <div class="row align-items-center mb-3">
          <div class="col-md-4">
            <h1 class="h3">Forums</h1>
          </div>
          <div class="col-md-5">
            <input
              id="forumSearch"
              type="text"
              class="form-control"
              placeholder="🔍 Search forums…"
            />
          </div>
          <div class="col-md-3 text-end">
            <button
              id="btnNewForum"
              class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#newForumModal"
            >
              + New Forum
            </button>
          </div>
        </div>

        <!-- Forums Grid -->
        <div id="forumsContainer" class="row g-4"></div>
      </main>
    </div>
  </div>

  <!-- New Forum Modal -->
  <div
    class="modal fade"
    id="newForumModal"
    tabindex="-1"
    aria-labelledby="newForumLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newForumLabel">Create New Forum</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formNewForum">
            <div class="mb-3">
              <label for="forumTitle" class="form-label">Title</label>
              <input type="text" id="forumTitle" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="forumDesc" class="form-label">Description</label>
              <textarea id="forumDesc" class="form-control" rows="3" required></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="submit" form="formNewForum" class="btn btn-primary">
            Create
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Forums List Script -->
  <script type="module" src="../js/forumsList.js"></script>
  <!-- Bootstrap Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
