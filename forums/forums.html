<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />
  <title>Forums • MadLabzDevs</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Your CSS -->
  <link href="../css/styles.css" rel="stylesheet" />

  <style>
    /* Offset for fixed header (32px) + nav (48px) */
    body { padding-top: calc(32px /* header */ + 48px /* nav */); }

    /* Hide “+ New Forum” until signed in */
    #btnNewForum { display: none; }
    body.signed-in #btnNewForum { display: inline-block; }
  </style>

  <!-- Load shared header/nav (absolute path) -->
  <script type="module" src="/js/header.js"></script>
</head>
<body id="page-top">

  <!-- Injected header/nav -->
  <div id="shared-header"></div>

  <!-- Spacer to push content below fixed header/nav -->
  <div class="pt-5 mt-5"></div>

  <!-- Page Layout: Sidebar + Main -->
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-3 bg-light vh-100 p-3 border-end">
        <h6 class="text-muted">Forums Navigation</h6>
        <ul id="forumsSidebar" class="nav flex-column mb-3">
          <li class="nav-item">
            <span class="text-muted ps-2">Loading…</span>
          </li>
        </ul>
        <input
          id="forumSearch"
          type="text"
          class="form-control"
          placeholder="🔍 Search forums…"
        />
      </aside>

      <!-- Main Content -->
      <main class="col-md-9 p-4">
        <!-- Header: Title, New Forum -->
        <div class="row align-items-center mb-3">
          <div class="col-md-4">
            <h1 class="h3">Forums</h1>
          </div>
          <div class="col-md-5"><!-- no duplicated search here --></div>
          <div class="col-md-3 text-end">
            <button
              id="btnNewForum"
              class="btn btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#newForumModal"
            >
              + New Forum
            </button>
          </div>
        </div>

        <!-- Forums List -->
        <div id="forumsContainer" class="list-group"></div>
      </main>
    </div>
  </div>

  <!-- New Forum Modal -->
  <div
    class="modal fade"
    id="newForumModal"
    tabindex="-1"
    aria-labelledby="newForumLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newForumLabel">Create New Forum</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formNewForum">
            <div class="mb-3">
              <label for="forumTitle" class="form-label">Title</label>
              <input type="text" id="forumTitle" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="forumDesc" class="form-label">Description</label>
              <textarea id="forumDesc" class="form-control" rows="3" required></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="submit" form="formNewForum" class="btn btn-primary">
            Create
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Forums List Script -->
  <script type="module" src="../js/forumsList.js"></script>
  <!-- Bootstrap Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
