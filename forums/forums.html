<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />
  <title>Forums • MadlabzDevs</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Optional: Your own CSS -->
  <link href="../css/styles.css" rel="stylesheet" />
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="../index.html">MadlabzDevs</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="forums.html">Forums</a></li>
          <li class="nav-item"><a class="nav-link" href="../profile.html">Profile</a></li>
          <!-- etc. -->
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="container my-4">
    <div class="d-flex align-items-center mb-3">
      <h1 class="me-auto">Forums</h1>
      <!-- New Category button (shown to admins) -->
      <button id="btnNewForum" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#newForumModal">
        + New Forum
      </button>
    </div>

    <!-- Forums Grid -->
    <div id="forumsContainer" class="row g-4">
      <!--
        Individual forum cards will be injected here by js/forumsList.js
        Each forumCard component (forums/components/forumCard.html) will render as a
        <div class="col-md-4"><div class="card">…</div></div>
      -->
    </div>
  </div>

  <!-- Include your New Forum modal markup (we’ll build this next) -->
  <div
    class="modal fade"
    id="newForumModal"
    tabindex="-1"
    aria-labelledby="newForumLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newForumLabel">Create New Forum</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formNewForum">
            <div class="mb-3">
              <label for="forumTitle" class="form-label">Title</label>
              <input type="text" id="forumTitle" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="forumDesc" class="form-label">Description</label>
              <textarea id="forumDesc" class="form-control" rows="3" required></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="submit" form="formNewForum" class="btn btn-primary">
            Create
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>
  <!-- Your Firebase initialization -->
  <script src="../js/firebase.js"></script>

  <!-- Forum logic: listing & creation -->
  <script src="../js/forumsList.js"></script>

  <!-- Bootstrap Bundle (includes Popper) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
