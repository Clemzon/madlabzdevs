<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />
  <title>Threads • MadLabzDevs</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Your CSS -->
  <link href="../css/styles.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
  />

  <style>
    /* Hide “New Thread” until signed in */
    #btnNewThread {
      display: none;
      padding: 0.25rem 0.5rem !important;
      font-size: 0.875rem !important;
    }
    body.signed-in #btnNewThread { display: inline-block; }

    /* Offset for fixed header (32px) + nav (48px) */
    body.dark-mode {
      padding-top: calc(32px + 48px) !important;
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
    }

    /* Sticky sidebar */
    .sidebar {
      position: sticky;
      top: calc(32px + 48px);
      background-color: var(--bs-bg-color);
      color: var(--bs-body-color);
      border-color: var(--bs-border-color);
    }

    /* Sidebar nav links */
    #forumsSidebar .nav-link {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      color: var(--bs-body-color);
    }
    #forumsSidebar .nav-link:hover,
    #forumsSidebar .nav-link:focus {
      color: var(--bs-link-hover-color);
      background-color: rgba(var(--bs-primary-rgb), 0.15);
      border-radius: var(--bs-border-radius);
    }

    /* Mobile toggle button */
    .mobile-forum-toggle { display: none; margin: 1rem; }
    @media (max-width: 767px) {
      aside.sidebar { display: none; }
      .mobile-forum-toggle { display: inline-block; }
    }
    @media (min-width: 768px) {
      .mobile-forum-toggle { display: none; }
    }
  </style>

  <!-- Load shared header/nav -->
  <script type="module" src="/js/header.js"></script>
</head>
<body id="page-top" class="dark-mode">

  <!-- Injected shared header/nav -->
  <div id="shared-header"></div>

  <!-- Spacer to push content below fixed header/nav -->
  <div class="pt-5 mt-5"></div>

  <!-- Mobile “Forums” offcanvas toggle -->
  <button
    class="btn btn-outline-primary mobile-forum-toggle"
    type="button"
    data-bs-toggle="offcanvas"
    data-bs-target="#forumsDrawer"
    aria-controls="forumsDrawer"
  >
    <i class="bi bi-list"></i> Forums
  </button>

  <!-- Offcanvas drawer for mobile forum nav -->
  <div
    class="offcanvas offcanvas-start bg-dark text-light"
    tabindex="-1"
    id="forumsDrawer"
    aria-labelledby="forumsDrawerLabel"
  >
    <div class="offcanvas-header">
      <h5 id="forumsDrawerLabel" class="text-light">Forums</h5>
      <button
        type="button"
        class="btn-close btn-close-white"
        data-bs-dismiss="offcanvas"
        aria-label="Close"
      ></button>
    </div>
    <div class="offcanvas-body">
      <ul id="forumsSidebarMobile" class="nav flex-column mb-3">
        <li class="nav-item">
          <span class="text-muted ps-2">Loading…</span>
        </li>
      </ul>
      <input
        id="forumSearchMobile"
        type="text"
        class="form-control bg-secondary text-light border-secondary"
        placeholder="🔍 Search threads…"
      />
    </div>
  </div>

  <!-- Page Layout: Sidebar + Main -->
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar (desktop only) -->
      <aside class="col-md-3 bg-dark vh-100 p-3 border-end sidebar">
        <h6 class="text-muted">Threads Navigation</h6>
        <ul id="forumsSidebar" class="nav flex-column mb-3">
          <li class="nav-item">
            <span class="text-muted ps-2">Loading…</span>
          </li>
        </ul>
        <input
          id="forumSearch"
          type="text"
          class="form-control bg-secondary text-light border-secondary"
          placeholder="🔍 Search threads…"
        />
      </aside>

      <!-- Main Content -->
      <main class="col-md-9 p-4">
        <!-- Breadcrumb placeholder -->
        <div id="breadcrumb-container"></div>

        <!-- Header: Title & New Thread -->
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <h1 id="forumTitle" class="h3 mb-1 text-light">Loading…</h1>
            <p id="forumDesc" class="text-muted mb-0 small">Please wait.</p>
          </div>
          <button
            id="btnNewThread"
            class="btn btn-primary btn-sm"
            data-bs-toggle="modal"
            data-bs-target="#newThreadModal"
          >
            <i class="bi bi-plus-lg me-1"></i>New Thread
          </button>
        </div>

        <!-- Threads List -->
        <div class="card shadow-sm mb-4 bg-dark text-light">
          <div class="card-body">
            <div id="threadsContainer" class="list-group list-group-flush">
              <!-- thread items injected here -->
            </div>
          </div>
        </div>

        <!-- Load More Threads -->
        <div class="text-center">
          <button
            id="btnLoadMoreThreads"
            class="btn btn-outline-primary btn-sm"
          >
            Load more threads
          </button>
        </div>
      </main>
    </div>
  </div>

  <!-- New Thread Modal -->
  <div
    class="modal fade"
    id="newThreadModal"
    tabindex="-1"
    aria-labelledby="newThreadLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content bg-dark text-light">
        <div class="modal-header">
          <h5 class="modal-title" id="newThreadLabel">Create New Thread</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formNewThread">
            <div class="mb-3">
              <label for="threadTitle" class="form-label">Thread Title</label>
              <input type="text" id="threadTitle" class="form-control bg-secondary text-light border-secondary" required />
            </div>
            <div class="mb-3">
              <label for="threadBody" class="form-label">Body</label>
              <textarea id="threadBody" class="form-control bg-secondary text-light border-secondary" rows="6" required></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="submit" form="formNewThread" class="btn btn-primary">
            Post Thread
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Auth listener -->
  <script type="module">
    import { onAuthChange } from '../js/firebase.js';
    onAuthChange(user => {
      document.body.classList.toggle('signed-in', !!user);
    });
  </script>

  <!-- Sidebar/Search handler -->
  <script type="module" src="../js/forumsList.js"></script>
  <!-- Threads logic (with pagination) -->
  <script type="module" src="../js/threadsList.js"></script>
  <!-- Breadcrumb injector -->
  <script type="module">
    import { injectBreadcrumbs } from '../js/breadCrumbs.js';
    injectBreadcrumbs();
  </script>
  <!-- Bootstrap Bundle & Icons -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
