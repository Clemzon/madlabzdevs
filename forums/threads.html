<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />
  <title>Threads • MadLabzDevs</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Your CSS -->
  <link href="../css/styles.css" rel="stylesheet" />

  <style>
    /* Hide “New Thread” until signed in */
    #btnNewThread { 
      display: none; 
      padding: 0.25rem 0.5rem !important;
      font-size: 0.875rem !important;
    }
    body.signed-in #btnNewThread { display: inline-block; }

    /* Offset for fixed header (32px) + nav (48px) */
    body { padding-top: calc(32px + 48px) !important; }

    /* Sticky sidebar */
    .sidebar { position: sticky; top: calc(32px + 48px); }

    /* Sidebar nav links */
    #forumsSidebar .nav-link {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
    }
  </style>

  <!-- Load shared header/nav -->
  <script type="module" src="/js/header.js"></script>
</head>
<body id="page-top">

  <!-- Injected shared header/nav -->
  <div id="shared-header"></div>

  <!-- Spacer to push content below fixed header/nav -->
  <div class="pt-5 mt-5"></div>

  <!-- Page Layout: Sidebar + Main -->
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-3 bg-light vh-100 p-3 border-end sidebar">
        <h6 class="text-muted">Threads Navigation</h6>
        <ul id="forumsSidebar" class="nav flex-column mb-3">
          <li class="nav-item">
            <span class="text-muted ps-2">Loading…</span>
          </li>
        </ul>
        <input
          id="forumSearch"
          type="text"
          class="form-control"
          placeholder="🔍 Search threads…"
        />
      </aside>

      <!-- Main Content -->
      <main class="col-md-9 p-4">
        <!-- Header: Title & New Thread -->
        <div class="d-flex align-items-center justify-content-between mb-4">
          <div>
            <h1 id="forumTitle" class="h3 mb-1">Loading…</h1>
            <p id="forumDesc" class="text-muted mb-0 small">Please wait.</p>
          </div>
          <button
            id="btnNewThread"
            class="btn btn-primary btn-sm"
            data-bs-toggle="modal"
            data-bs-target="#newThreadModal"
          >
            <i class="bi bi-plus-lg me-1"></i>New Thread
          </button>
        </div>

        <!-- Threads List -->
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <div id="threadsContainer" class="list-group list-group-flush">
              <!-- thread items injected here -->
            </div>
          </div>
        </div>

        <!-- Load More Threads -->
        <div class="text-center">
          <button
            id="btnLoadMoreThreads"
            class="btn btn-outline-primary btn-sm"
          >
            Load more threads
          </button>
        </div>
      </main>
    </div>
  </div>

  <!-- New Thread Modal -->
  <div
    class="modal fade"
    id="newThreadModal"
    tabindex="-1"
    aria-labelledby="newThreadLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newThreadLabel">Create New Thread</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formNewThread">
            <div class="mb-3">
              <label for="threadTitle" class="form-label">Thread Title</label>
              <input type="text" id="threadTitle" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="threadBody" class="form-label">Body</label>
              <textarea id="threadBody" class="form-control" rows="6" required></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="submit" form="formNewThread" class="btn btn-primary">
            Post Thread
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Auth listener -->
  <script type="module">
    import { onAuthChange } from '../js/firebase.js';
    onAuthChange(user => {
      document.body.classList.toggle('signed-in', !!user);
    });
  </script>

  <!-- Sidebar/Search handler -->
  <script type="module" src="../js/forumsList.js"></script>
  <!-- Threads logic (with pagination) -->
  <script type="module" src="../js/threadsList.js"></script>
  <!-- Bootstrap Bundle & Icons -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
