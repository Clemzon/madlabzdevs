<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />
  <title>Threads • MadlabzDevs</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Your CSS -->
  <link href="../css/styles.css" rel="stylesheet" />
</head>
<body id="page-top">

  <!-- Static Header Bar -->
  <header class="bg-dark text-white py-2 fixed-top">
    <div class="container px-4 px-lg-5">
      <span class="h5 mb-0">MadLabzDevs</span>
    </div>
  </header>

  <!-- Horizontal Top Nav -->
  <nav
    class="navbar navbar-expand-sm navbar-light bg-light border-bottom overflow-auto fixed-top"
    style="top:32px; z-index:1030;"
  >
    <div class="container px-4 px-lg-5">
      <ul class="navbar-nav flex-row flex-nowrap">
        <li class="nav-item">
          <a class="nav-link px-3" href="../projects.html">Projects</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3" href="forums.html">Forums</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3" href="../events.html">Events</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3" href="../portfolio.html">Portfolio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3 active" href="../profile.html">Profile</a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Spacer to push content below fixed header/nav -->
  <div class="pt-5 mt-5"></div>

  <!-- Page Layout: Sidebar + Main -->
  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <aside class="col-md-3 bg-light vh-100 p-3 border-end">
        <h6 class="text-muted">Forums Navigation</h6>
        <ul id="forumsSidebar" class="nav flex-column mb-3">
          <li class="nav-item">
            <span class="text-muted ps-2">Loading…</span>
          </li>
        </ul>
        <input
          id="forumSearch"
          type="text"
          class="form-control"
          placeholder="🔍 Search forums…"
        />
      </aside>

      <!-- Main Content -->
      <main class="col-md-9 p-4">
        <!-- Header: will be filled by threadsList.js -->
        <div class="d-flex align-items-center mb-3">
          <div>
            <h1 id="forumTitle" class="mb-1">Loading…</h1>
            <p id="forumDesc" class="text-muted mb-0">Please wait.</p>
          </div>
          <button
            id="btnNewThread"
            class="btn btn-primary ms-auto"
            data-bs-toggle="modal"
            data-bs-target="#newThreadModal"
          >
            + New Thread
          </button>
        </div>

        <!-- Threads List -->
        <div id="threadsContainer" class="list-group"></div>
      </main>
    </div>
  </div>

  <!-- New Thread Modal -->
  <div
    class="modal fade"
    id="newThreadModal"
    tabindex="-1"
    aria-labelledby="newThreadLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newThreadLabel">Create New Thread</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formNewThread">
            <div class="mb-3">
              <label for="threadTitle" class="form-label">Thread Title</label>
              <input type="text" id="threadTitle" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="threadBody" class="form-label">Body</label>
              <textarea id="threadBody" class="form-control" rows="6" required></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Cancel
          </button>
          <button type="submit" form="formNewThread" class="btn btn-primary">
            Post Thread
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidebar/Search handler -->
  <script type="module" src="../js/forumsList.js"></script>
  <!-- Threads logic -->
  <script type="module" src="../js/threadsList.js"></script>
  <!-- Bootstrap Bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
