<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign Up – MadLabzDevs</title>
  <link rel="icon" href="../../assets/favicon.ico" />
  <!-- Bootstrap & Core CSS -->
  <link href="../../css/styles.css" rel="stylesheet" />
  <style>
    body.dark-mode {
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      padding-top: calc(32px + 48px) !important;
    }
    form#signupForm label,
    form#signupForm p,
    form#signupForm a,
    form#signupForm .form-check-label,
    form#signupForm .form-check-input {
      color: var(--bs-body-color);
    }
    form#signupForm .form-control {
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      border-color: var(--bs-border-color);
    }
    form#signupForm .form-control::placeholder {
      color: var(--bs-secondary-color);
    }
    form#signupForm .form-control:focus {
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      border-color: var(--bs-primary);
      box-shadow: 0 0 0 0.25rem rgba(var(--bs-primary-rgb), 0.25);
    }
    form#signupForm .btn-primary {
      background-color: var(--bs-primary);
      border-color: var(--bs-primary);
      color: #fff;
    }
    form#signupForm .btn-primary:hover,
    form#signupForm .btn-primary:focus {
      background-color: var(--bs-primary-dark);
      border-color: var(--bs-primary-dark);
      color: #fff;
    }
    #signupFeedback.text-success {
      color: #198754; /* Bootstrap success green */
    }
    #signupFeedback.text-danger {
      color: #dc3545; /* Bootstrap danger red */
    }
  </style>
</head>
<body class="dark-mode">

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <h2 class="mb-4 text-center text-light">Create Your Account</h2>

        <!-- Sign-Up Form -->
        <form id="signupForm" class="card p-4 shadow-sm bg-dark text-light border-secondary">
          <!-- Username -->
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              class="form-control"
              placeholder="Choose a username"
              required
            />
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              class="form-control"
              placeholder="you@example.com"
              required
            />
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              class="form-control"
              placeholder="••••••••"
              required
              minlength="6"
            />
            <!-- Confirm Password -->
            <label for="confirmPassword" class="form-label mt-3">Confirm Password</label>
            <input
              id="confirmPassword"
              name="confirmPassword"
              type="password"
              class="form-control"
              placeholder="••••••••"
              required
              minlength="6"
            />
            <!-- Show Password Checkbox -->
            <div class="form-check mt-2">
              <input class="form-check-input" type="checkbox" id="showPasswordCheckbox" />
              <label class="form-check-label" for="showPasswordCheckbox">
                Show Passwords
              </label>
            </div>
          </div>

          <!-- Error / Success Message -->
          <div id="signupFeedback" class="mb-3 text-center" role="alert" aria-live="polite"></div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary w-100">Sign Up</button>

          <!-- Link to Sign-In -->
          <p class="mt-3 text-center text-light">
            Already have an account?
            <a href="signin.html" id="showSignIn" class="link-primary">Sign In</a>
          </p>
        </form>

      </div>
    </div>
  </main>

  <!-- Firebase & Auth Scripts -->
  <script type="module">
    import { signUp, onAuthChange } from "/js/firebase.js";

    const form     = document.getElementById("signupForm");
    const feedback = document.getElementById("signupFeedback");
    const confirmPwdInput = form.confirmPassword;
    const showPwdCheckbox = document.getElementById('showPasswordCheckbox');
    const submitBtn       = form.querySelector('button[type="submit"]');

    // Helper to read ?redirect=...
    function getRedirect() {
      const params = new URLSearchParams(window.location.search);
      return params.get('redirect') || '/';
    }
    const redirect = getRedirect();

    // Update Sign In link to preserve redirect
    document.getElementById('showSignIn').href =
      `signin.html?redirect=${encodeURIComponent(redirect)}`;

    // Listen for form submit
    form.addEventListener("submit", async e => {
      e.preventDefault();

      const username = form.username.value.trim();
      const email    = form.email.value.trim();
      const pass     = form.password.value;

      // Validate matching passwords
      if (pass !== confirmPwdInput.value) {
        feedback.className = "text-danger";
        feedback.textContent = "Passwords do not match.";
        return;
      }
      // Disable submit
      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account…";
      feedback.textContent = ""; // clear

      try {
        // ← Correct argument order: (username, email, password)
        const userCred = await signUp(username, email, pass);
        feedback.className = "text-success";
        feedback.textContent = `Success! Welcome, ${userCred.user.displayName}. Redirecting…`;

        // Auto-redirect back to original page
        setTimeout(() => window.location.href = redirect, 1000);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign Up";
        feedback.className = "text-danger";
        feedback.textContent = `Error: ${err.message}`;
      }
    });

    // Toggle visibility of both password fields
    showPwdCheckbox.addEventListener('change', () => {
      const type = showPwdCheckbox.checked ? 'text' : 'password';
      form.password.type = type;
      form.confirmPassword.type = type;
    });
  </script>
</body>
</html>
