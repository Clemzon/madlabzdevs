<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In – MadLabzDevs</title>
  <link rel="icon" href="../../assets/favicon.ico" />
  <!-- Bootstrap & Core CSS -->
  <link href="../../css/styles.css" rel="stylesheet" />
  <style>
    body.dark-mode {
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      padding-top: calc(32px + 48px) !important;
    }
    /* Dark mode form controls */
    form#signinForm label,
    form#signinForm p,
    form#signinForm a,
    form#signinForm .form-check-label,
    form#signinForm .form-check-input {
      color: var(--bs-body-color);
    }
    form#signinForm .form-control {
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      border-color: var(--bs-border-color);
    }
    form#signinForm .form-control::placeholder {
      color: var(--bs-secondary-color);
    }
    form#signinForm .form-control:focus {
      background-color: var(--bs-body-bg);
      color: var(--bs-body-color);
      border-color: var(--bs-primary);
      box-shadow: 0 0 0 0.25rem rgba(var(--bs-primary-rgb), 0.25);
    }
    form#signinForm .btn-primary {
      background-color: var(--bs-primary);
      border-color: var(--bs-primary);
      color: #fff;
    }
    form#signinForm .btn-primary:hover,
    form#signinForm .btn-primary:focus {
      background-color: var(--bs-primary-dark);
      border-color: var(--bs-primary-dark);
      color: #fff;
    }
    #signinFeedback.text-success {
      color: #198754; /* Bootstrap success green */
    }
    #signinFeedback.text-danger {
      color: #dc3545; /* Bootstrap danger red */
    }
  </style>
</head>
<body class="dark-mode">

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <h2 class="mb-4 text-center text-light">Welcome Back</h2>

        <!-- Sign-In Form -->
        <form id="signinForm" class="card p-4 shadow-sm bg-dark text-light border-secondary">
          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input id="email" name="email" type="email" class="form-control" placeholder="you@example.com" required autofocus />
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              class="form-control"
              placeholder="••••••••"
              required
            />
            <div class="form-check mt-2">
              <input
                class="form-check-input"
                type="checkbox"
                id="showPasswordCheck"
              />
              <label class="form-check-label" for="showPasswordCheck">
                Show Password
              </label>
            </div>
          </div>

          <!-- Feedback Message -->
          <div id="signinFeedback" class="mb-3 text-center" role="alert" aria-live="polite"></div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary w-100" id="signinSubmit">Sign In</button>

          <!-- Link to Sign-Up -->
          <p class="mt-3 text-center text-light">
            Don’t have an account?
            <a href="signup.html" id="showSignUp" class="link-primary">Create one</a>
          </p>
        </form>

      </div>
    </div>
  </main>

  <!-- Firebase & Auth Scripts -->
  <script type="module">
    import { signIn, onAuthChange } from "../../js/firebase.js";

    const form     = document.getElementById("signinForm");
    const feedback = document.getElementById("signinFeedback");
    const submitBtn = document.getElementById("signinSubmit");

    // Helper to read ?redirect=...
    function getRedirect() {
      const params = new URLSearchParams(window.location.search);
      return params.get('redirect') || '/';
    }
    const redirect = getRedirect();

    // Update Sign-Up link to include redirect
    document.getElementById('showSignUp').href =
      `signup.html?redirect=${encodeURIComponent(redirect)}`;

    // Listen for form submit
    form.addEventListener("submit", async e => {
      e.preventDefault();
      feedback.textContent = ""; // clear

      try {
        feedback.textContent = "Signing in…";
        submitBtn.disabled = true;
        submitBtn.textContent = "Signing in…";
        await signIn(form.email.value.trim(), form.password.value);
        feedback.className = "text-success";
        feedback.textContent = "Success! Redirecting…";
        setTimeout(() => window.location.href = redirect, 800);
      } catch (err) {
        feedback.className = "text-danger";
        feedback.textContent = `Error: ${err.message}`;
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
      }
    });

    // If already signed in, redirect immediately
    onAuthChange(user => {
      if (user) window.location.href = redirect;
    });

    const showPasswordCheck = document.getElementById('showPasswordCheck');
    showPasswordCheck.addEventListener('change', () => {
      const pwd = document.getElementById('password');
      pwd.type = showPasswordCheck.checked ? 'text' : 'password';
    });
  </script>
</body>
</html>
