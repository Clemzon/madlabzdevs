

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>Visitor Dashboard – MadLabzDevs</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Core theme CSS -->
  <link href="css/styles.css" rel="stylesheet" />
</head>
<body id="page-top">


  <!-- Dashboard Content -->
  <div class="container-fluid py-4">
    <!-- Page Title -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1 class="h3 mb-0">Visitor Dashboard</h1>
    </div>

    <!-- Summary Cards -->
    <div class="row mb-4">
      <div class="col-md-3 col-sm-6 mb-3">
        <div class="card h-100 border-primary">
          <div class="card-body text-center">
            <h5 class="card-title">Total Projects</h5>
            <p class="display-6 mb-0">24</p>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6 mb-3">
        <div class="card h-100 border-success">
          <div class="card-body text-center">
            <h5 class="card-title">Messages Received</h5>
            <p class="display-6 mb-0">8</p>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6 mb-3">
        <div class="card h-100 border-warning">
          <div class="card-body text-center">
            <h5 class="card-title">Upcoming Events</h5>
            <p class="display-6 mb-0">3</p>
          </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-6 mb-3">
        <div class="card h-100 border-info">
          <div class="card-body text-center">
            <h5 class="card-title">Profile Visits</h5>
            <p class="display-6 mb-0">150</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Recent Activity -->
    <div class="card mb-4">
      <div class="card-header">
        <i class="bi-clock-history me-2"></i> Recent Activity
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped mb-0">
            <thead class="table-light">
              <tr>
                <th>Date</th>
                <th>Activity</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>2025-07-20</td>
                <td>Viewed portfolio page</td>
                <td><span class="badge bg-success">Viewed</span></td>
              </tr>
              <tr>
                <td>2025-07-19</td>
                <td>Signed up for BEPBuddy Android Test</td>
                <td><span class="badge bg-success">Registered</span></td>
              </tr>
              <tr>
                <td>2025-07-18</td>
                <td>Requested web demo access</td>
                <td><span class="badge bg-warning">Pending</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap core JS-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
