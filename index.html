<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <title>MadLabzDevs Dashboard</title>
  <!-- Favicon-->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Bootstrap Icons-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Core theme CSS (includes MadLabzDevs)-->
  <link href="css/styles.css" rel="stylesheet" />
  <style>
    /* Offset for fixed header (32px) + nav (48px) */
    body {
      padding-top: calc(32px + 48px) !important;
    }
    /* Keep nav items on one line and scrollable */
    .navbar-nav {
      white-space: nowrap;
    }
    .navbar-nav .nav-link {
      flex-shrink: 0;
    }
  </style>
</head>
<body id="page-top">

  <!-- Static Header Bar -->
  <header class="bg-dark text-white py-2 fixed-top w-100" role="banner">
    <div class="container px-4 px-lg-5">
      <span class="h5 mb-0">MadLabzDevs</span>
    </div>
  </header>

  <!-- Horizontal scrolling top nav bar -->
  <nav class="navbar navbar-light bg-light border-bottom overflow-auto fixed-top"
       style="top:32px; z-index:1030;"
       role="navigation" aria-label="Primary">
    <div class="container px-4 px-lg-5">
      <ul class="navbar-nav flex-row flex-nowrap">
        <li class="nav-item"><a class="nav-link px-3" href="projects.html">Projects</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="message_board.html">Message Board</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="events.html">Events</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="portfolio.html">Portfolio</a></li>

      </ul>
    </div>
  </nav>

  <main id="mainContent" class="container-fluid py-4">
    <!-- Under Construction Banner -->
    <div class="alert alert-warning text-center mb-4" role="alert">
      <strong>Under Construction!</strong> This dashboard is currently being built.
    </div>

    <!-- Welcome Banner -->
    <div class="text-center mb-5">
      <h1 class="display-4">Welcome to MadLabzDevs</h1>
      <p class="lead">Your central hub for all activities and updates.</p>
    </div>

    <!-- Basic Dashboard Cards -->
    <div class="row g-4">
      <div class="col-6 col-md-3">
        <div class="card h-100 border-primary">
          <div class="card-body text-center">
            <h5 class="card-title">Projects</h5>
            <p class="display-6 mb-0">--</p>
          </div>
        </div>

      <div class="col-6 col-md-3">
        <div class="card h-100 border-success">
          <div class="card-body text-center">
            <h5 class="card-title">Messages</h5>
            <p class="display-6 mb-0">--</p>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card h-100 border-warning">
          <div class="card-body text-center">
            <h5 class="card-title">Events</h5>
            <p class="display-6 mb-0">--</p>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="card h-100 border-info">
          <div class="card-body text-center">
            <h5 class="card-title">Profile Completeness</h5>
            <p class="display-6 mb-0">--</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap core JS-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
