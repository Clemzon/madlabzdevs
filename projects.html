<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>MadLabzDevs Projects</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <!-- Core theme CSS (includes Bootstrap)-->
  <link href="css/styles.css" rel="stylesheet" />
  <style>
    /* Offset for fixed header (32px) + nav (48px) */
    body { padding-top: calc(32px /* header */ + 48px /* nav */) !important; }
  </style>

  <!-- Load shared header/nav -->
  <script type="module" src="/js/header.js"></script>
</head>

<body id="page-top">

  <!-- Injected shared header/nav -->
  <div id="shared-header"></div>

  <!-- Spacer to push content below fixed header/nav -->
  <div class="pt-5 mt-5"></div>

  <div class="container-fluid">
    <h1 class="mt-4 mb-5">Projects</h1>

    <!-- Android Apps Section -->
    <section id="android-apps" class="mb-5">
      <h2>Android Apps</h2>
      <div class="row">
        <div class="col-lg-4 col-sm-6 mb-4">
          <div class="card h-100">
            <img src="assets/img/placeholder.png" class="card-img-top" alt="Project Name">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">Project Android 1</h5>
              <p class="card-text">Short description of Android app.</p>
              <a href="#" class="btn btn-primary mt-auto">View Details</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- iOS Apps Section -->
    <section id="ios-apps" class="mb-5">
      <h2>iOS Apps</h2>
      <div class="row">
        <!-- Add iOS projects here -->
      </div>
    </section>

    <!-- macOS Apps Section -->
    <section id="macos-apps" class="mb-5">
      <h2>macOS Apps</h2>
      <div class="row">
        <!-- Add macOS projects here -->
      </div>
    </section>

    <!-- Windows Apps Section -->
    <section id="windows-apps" class="mb-5">
      <h2>Windows Apps</h2>
      <div class="row">
        <!-- Add Windows projects here -->
      </div>
    </section>

    <!-- Web Projects Section -->
    <section id="web-projects" class="mb-5">
      <h2>Web Projects</h2>
      <div class="row">
        <div class="col-lg-4 col-sm-6 mb-4">
          <div class="card h-100">
            <img src="assets/img/portfolio/bepbuddy-thumbnail.png" class="card-img-top" alt="BEPBuddy (Web)">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">BEPBuddy (Web)</h5>
              <p class="card-text">
                BEPBuddy is a concept project intended to assist Blind Vendors in the B.E.P. Program...
              </p>
              <a href="https://www.bepbuddy.com"
                 class="btn btn-primary mt-auto"
                 target="_blank"
                 rel="noopener noreferrer">
                Visit Site
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- MadLabzDevs core JS-->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
