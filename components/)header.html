<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>MadLabzDevs Nav Bar Demo</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    /* Offset for fixed header (32px) + nav (48px) */
    body {
      padding-top: calc(32px + 48px) !important;
    }

    /* Keep nav items on one line and scrollable */
    .navbar-nav {
      white-space: nowrap;
    }
    .navbar-nav .nav-link {
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <!-- Static Header Bar -->
  <header class="bg-dark text-white py-2 fixed-top w-100" role="banner">
    <div class="container">
      <span class="h5 mb-0">MadLabzDevs</span>
    </div>
  </header>

  <!-- Horizontal scrolling top nav bar -->
  <nav
    class="navbar navbar-light bg-light border-bottom overflow-auto fixed-top"
    style="top:32px; z-index:1030;"
    role="navigation"
    aria-label="Primary"
  >
    <div class="container">
      <ul class="navbar-nav flex-row flex-nowrap">
        <li class="nav-item"><a class="nav-link px-3" href="projects.html">Projects</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="forums/forums.html">Forums</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="events.html">Events</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="portfolio.html">Portfolio</a></li>
        <li class="nav-item"><a class="nav-link px-3" href="profile.html">Profile</a></li>
      </ul>
    </div>
  </nav>

  <!-- Dummy page content -->
  <main class="container py-5">
    <p>Scroll horizontally on the nav bar above if your window is narrow.</p>
  </main>

  <!-- Bootstrap JS (optional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
