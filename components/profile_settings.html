<!-- Shared header/nav -->
<div id="shared-header"></div>

<main class="container my-5">
  <div class="card p-4">
    <h2 class="mb-4">Profile Settings</h2>
    <form id="profileSettingsForm">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" readonly class="form-control" id="username" name="username" />
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" readonly class="form-control" id="email" name="email" />
      </div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="showEmail" name="showEmail" />
        <label class="form-check-label" for="showEmail">Show Email</label>
      </div>
      <div class="mb-3">
        <label for="displayName" class="form-label">New Display Name</label>
        <input type="text" class="form-control" id="displayName" name="displayName" />
      </div>
      <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
    <div id="settingsFeedback" role="alert" aria-live="polite" class="mt-3"></div>
  </div>
</main>

<script type="module" src="/js/header.js"></script>
