<!-- components/donate_btn.html -->
<!-- Donation button module -->

<!-- Donation Button -->
<button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#donateModal">
  Buy me a beer! 🍺
</button>

<!-- Donation Modal -->
<div class="modal fade" id="donateModal" tabindex="-1" aria-labelledby="donateModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="donateModalLabel">Support Me on Cash App</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <p>Choose an amount to donate to <strong>$Clemzon</strong> — thank you! 🙏</p>
        <div class="d-flex justify-content-around mt-4">
          <a href="https://cash.app/$Clemzon/5" target="_blank" rel="noopener" class="btn btn-outline-primary">Donate $5</a>
          <a href="https://cash.app/$Clemzon/10" target="_blank" rel="noopener" class="btn btn-outline-primary">Donate $10</a>
          <a href="https://cash.app/$Clemzon/25" target="_blank" rel="noopener" class="btn btn-outline-primary">Donate $25</a>
        </div>
        <small class="d-block mt-3 text-muted">Your support helps keep things brewing! ☕</small>
      </div>
    </div>
  </div>
</div>
