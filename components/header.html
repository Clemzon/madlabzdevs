<style>
  body {
    padding-top: calc(32px + 48px) !important;
  }
  #btnAccount {
    color: var(--bs-light);
    background: transparent;
    border: none;
  }
  #btnAccount::after {
    margin-left: 0.25rem;
  }

  /* Dark theme header */
  header.bg-dark {
    background-color: #212529 !important; /* dark background */
    border-bottom: 1px solid #343a40; /* subtle border bottom */
  }

  /* Clickable brand (Home) */
  .brand-home {
    color: #f8f9fa !important;
    text-decoration: none !important;
    margin-right: 1rem;
  }
  .brand-home:hover,
  .brand-home:focus {
    text-decoration: underline !important;
  }

  /* Nav links container: horizontal scroll */
  .nav-links-scroll {
    display: flex;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
    scrollbar-color: #495057 transparent;
    margin-left: 1rem;
    margin-right: 1rem;
    flex-grow: 1; /* fill space between title and dropdown */
  }
  .nav-links-scroll::-webkit-scrollbar {
    height: 6px;
  }
  .nav-links-scroll::-webkit-scrollbar-thumb {
    background-color: #495057;
    border-radius: 3px;
  }

  .nav-links-scroll a.nav-link {
    flex: 0 0 auto;
    color: #adb5bd !important; /* light gray */
    padding: 0.375rem 0.75rem;
    white-space: nowrap;
  }
  .nav-links-scroll a.nav-link:hover,
  .nav-links-scroll a.nav-link:focus {
    color: #f8f9fa !important; /* bright on hover/focus */
  }
  .nav-links-scroll a.nav-link.active {
    color: #ffffff !important;
    border-bottom: 2px solid #0d6efd; /* subtle active indicator */
  }

  /* Dropdown menu dark styles */
  .dropdown-menu {
    background-color: #343a40 !important;
    color: #f8f9fa !important;
    border-color: #454d55 !important;
    min-width: 12rem; /* prevent tiny width */
    z-index: 1050; /* ensure above other elements */
  }
  .dropdown-menu .dropdown-item {
    color: #adb5bd !important;
  }
  .dropdown-menu .dropdown-item:hover,
  .dropdown-menu .dropdown-item:focus {
    background-color: #495057 !important;
    color: #f8f9fa !important;
  }

  /* Dropdown toggle button */
  #btnAccount.btn {
    color: #f8f9fa !important;
  }
  #btnAccount.btn:hover,
  #btnAccount.btn:focus {
    color: #fff !important;
  }

  /* Prevent flex container from clipping dropdown */
  header > .container-fluid {
    overflow: visible !important;
  }

  /* Accessible focus rings */
  a:focus-visible,
  button:focus-visible {
    outline: 2px solid #f8f9fa;
    outline-offset: 2px;
  }
</style>

<header class="bg-dark text-white py-2 fixed-top w-100" role="banner">
  <div class="container-fluid d-flex align-items-center px-4">
    <!-- Brand now links Home -->
    <a href="/index.html"
       class="h5 mb-0 brand-home"
       aria-label="MadLabzDevs Home"
       rel="home">
      MadLabzDevs
    </a>

    <nav class="nav-links-scroll" aria-label="Primary navigation" role="navigation">
      <a class="nav-link px-3" href="/projects.html">Projects</a>
      <a class="nav-link px-3" href="/events.html">Events</a>
      <a class="nav-link px-3" href="/contact_page.html">Contact Us</a>
      <a class="nav-link px-3" href="/portfolio.html">Portfolio</a>
      <!-- Profile tab will be dynamically inserted here by JS -->
    </nav>

    <div class="dropdown">
      <button
        id="btnAccount"
        class="btn btn-sm dropdown-toggle"
        data-bs-toggle="dropdown"
        aria-haspopup="true"
        aria-expanded="false"
        type="button"
      >
        <span class="visually-hidden">User menu</span>
        Account
      </button>
      <ul id="accountMenu" class="dropdown-menu dropdown-menu-end" role="menu" aria-label="Account menu">
        <!-- JS will populate sign up / login options here -->
      </ul>
    </div>
  </div>
</header>

<script>
  // Lightweight "active" marker for current page
  (function () {
    const path = location.pathname.replace(/\/+$/, '').toLowerCase();
    document
      .querySelectorAll('nav[aria-label="Primary navigation"] a.nav-link')
      .forEach(a => {
        const href = (a.getAttribute('href') || '').replace(/\/+$/, '').toLowerCase();
        if (href && (path === href)) {
          a.classList.add('active');
          a.setAttribute('aria-current', 'page');
        }
      });
  })();
</script>
