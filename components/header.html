<style>
  /* Fixed header spacing */
  body { padding-top: calc(32px + 48px) !important; }

  /* Header shell */
  header.bg-dark {
    background-color: #212529 !important;
    border-bottom: 1px solid #343a40;
  }

  /* Row 1: brand */
  .topbar {
    display: flex;
    align-items: center;
    min-height: 48px;
  }

  .brand-home {
    color: #f8f9fa !important;
    text-decoration: none !important;
    margin-right: 1rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .brand-home:hover,
  .brand-home:focus { text-decoration: underline !important; }

  /* Row 2: navigation */
  .nav-row {
    border-top: 1px solid #343a40;
    background: #1b1f23;
  }

  .nav-inline {
    display: flex;
    flex-wrap: wrap;
    gap: .25rem .5rem;
    padding: .25rem 0;
  }

  .nav-inline .nav-link {
    color: #adb5bd !important;
    padding: 0.375rem 0.75rem;
    text-decoration: none;
    border-radius: .375rem;
  }

  .nav-inline .nav-link:hover,
  .nav-inline .nav-link:focus {
    color: #f8f9fa !important;
    background: #2a2f35;
  }

  .nav-inline .nav-link.active {
    color: #ffffff !important;
    border-bottom: 2px solid #0d6efd;
  }

  /* Containers */
  header > .container-fluid { overflow: visible !important; }

  .topbar .container-fluid,
  .nav-row .container-fluid {
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  /* Focus rings */
  a:focus-visible,
  button:focus-visible {
    outline: 2px solid #f8f9fa;
    outline-offset: 2px;
  }

  @media (max-width: 576px) {
    body { padding-top: calc(28px + 48px) !important; }
    .nav-inline .nav-link {
      padding: 0.35rem 0.6rem;
      font-size: .95rem;
    }
  }
</style>

<header class="bg-dark text-white fixed-top w-100" role="banner">
  <!-- Row 1: brand -->
  <div class="topbar">
    <div class="container-fluid d-flex align-items-center">
      <a href="/index.html" class="h5 mb-0 brand-home" aria-label="MadLabzDevs Home" rel="home">
        MadLabzDevs
      </a>
    </div>
  </div>

  <!-- Row 2: navigation -->
  <div class="nav-row">
    <div class="container-fluid">
      <nav id="primaryNav" class="nav-inline" aria-label="Primary navigation">
        <a class="nav-link px-3" href="/projects.html">Projects</a>
        <a class="nav-link px-3" href="/events.html">Events</a>
        <a class="nav-link px-3" href="/under_construction.html">Community</a>
        <a class="nav-link px-3" href="/wcag_508.html">WCAG/Section 508</a>
      </nav>
    </div>
  </div>
</header>

<script>
  // Mark the current page in the primary navigation.
  (function () {
    const path = location.pathname.replace(/\/+$/, '').toLowerCase();

    document
      .querySelectorAll('#primaryNav a.nav-link')
      .forEach(link => {
        const href = (link.getAttribute('href') || '')
          .replace(/\/+$/, '')
          .toLowerCase();

        if (href && path === href) {
          link.classList.add('active');
          link.setAttribute('aria-current', 'page');
        }
      });
  })();
</script>
